id = "p-video"
label = "P-Video"
category = "VID"
platform = "replicate"
endpoint = "prunaai/p-video"
description = "Pruna AI's P-Video: fast video generation (5s 720p in ~10s) with a built-in draft mode that is 4x faster for quick previews. Text-to-video, image-to-video, and audio-to-video in one endpoint with native audio generation. Up to 1080p at 48 FPS."

[pricing]
cost_per_second = 0.02
currency = "USD"
note = "$0.02/sec at 720p, $0.04/sec at 1080p. Draft mode is 4x cheaper ($0.005/$0.01 per sec)."

[general]
image_url_param = "image"
duration_type = "seconds"
duration_param_name = "duration"
slots = ["audio"]

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "16:9"
optional = true
options = [
  { value = "16:9", label = "16:9 · Landscape" },
  { value = "9:16", label = "9:16 · Portrait · Vertical" },
  { value = "4:3",  label = "4:3" },
  { value = "3:4",  label = "3:4" },
  { value = "3:2",  label = "3:2" },
  { value = "2:3",  label = "2:3" },
  { value = "1:1",  label = "1:1 · Square" },
]
note = "Ignored when an input image is provided"

[params.duration]
label = "Duration"
type = "select"
default = "5"
options = [
  { value = "1",  label = "1s" },
  { value = "2",  label = "2s" },
  { value = "3",  label = "3s" },
  { value = "4",  label = "4s" },
  { value = "5",  label = "5s · Default" },
  { value = "6",  label = "6s" },
  { value = "7",  label = "7s" },
  { value = "8",  label = "8s" },
  { value = "9",  label = "9s" },
  { value = "10", label = "10s · Max" },
]
note = "Ignored when audio input is provided"

[params.resolution]
label = "Resolution"
type = "select"
default = "720p"
options = [
  { value = "720p",  label = "720p · Standard" },
  { value = "1080p", label = "1080p · Full HD" },
]

[params.fps]
label = "Frames Per Second"
type = "select"
default = "24"
options = [
  { value = "24", label = "24 FPS" },
  { value = "48", label = "48 FPS · Smoother" },
]

[params.draft]
label = "Draft Mode"
type = "boolean"
default = false
description = "4x faster, lower-quality previews at 4x lower cost"

[params.prompt_upsampling]
label = "Prompt Upsampling"
type = "boolean"
default = true
description = "Automatically enhance the prompt"

[params.seed]
label = "Random Seed"
type = "integer"
default = -1
min = -1
max = 2147483647
optional = true
hidden = true
