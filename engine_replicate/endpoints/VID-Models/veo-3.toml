id = "veo-3"
label = "Veo 3"
category = "VID"
platform = "replicate"
endpoint = "google/veo-3"
description = "Google DeepMind's Veo 3: flagship text-to-video model with native audio generation, dialogue and lip-sync, and cinematic quality. Supports both text-to-video and image-to-video."

[pricing]
cost_per_second = 0.50
currency = "USD"

[general]
image_url_param = "image"
duration_type = "seconds"
duration_param_name = "duration"

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "16:9"
optional = true
options = [
  { value = "16:9", label = "16:9 · Landscape" },
  { value = "9:16", label = "9:16 · Portrait · Vertical" },
]

[params.duration]
label = "Duration"
type = "select"
default = "8"
options = [
  { value = "4", label = "4s · Short" },
  { value = "6", label = "6s · Medium" },
  { value = "8", label = "8s · Long" },
]

[params.resolution]
label = "Resolution"
type = "select"
default = "1080p"
optional = true
options = [
  { value = "720p",  label = "720p" },
  { value = "1080p", label = "1080p · Full HD" },
]

[params.generate_audio]
label = "Generate Native Audio"
type = "boolean"
default = true
description = "Add ambient noise, sound effects, and dialogue that sync naturally with visuals"

[params.negative_prompt]
label = "Negative Prompt"
type = "text"
optional = true
default = ""

[params.seed]
label = "Random Seed"
type = "integer"
default = -1
min = -1
max = 2147483647
optional = true
hidden = true
