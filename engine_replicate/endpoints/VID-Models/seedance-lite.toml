id = "seedance-lite"
label = "Seedance Lite"
category = "VID"
platform = "replicate"
endpoint = "bytedance/seedance-1-lite"
description = "ByteDance's Seedance Lite: affordable text-to-video and image-to-video at up to 720p. Supports first/last frame interpolation, camera control, and multi-shot generation."

[pricing]
cost_per_second = 0.036
currency = "USD"
note = "Cost varies: 480p at $0.018/s, 720p at $0.036/s"

[general]
image_url_param = "image"
duration_type = "seconds"
duration_param_name = "duration"
slots = ["reference_images", "last_frame_image"]

[params.resolution]
label = "Resolution"
type = "select"
default = "720p"
options = [
  { value = "480p", label = "480p · Lower cost ($0.018/s)" },
  { value = "720p", label = "720p · Standard ($0.036/s)" },
  { value = "1080p", label = "1080p · Full HD" },
]

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "16:9"
optional = true
options = [
  { value = "16:9", label = "16:9 · Landscape" },
  { value = "4:3",  label = "4:3 · Classic" },
  { value = "1:1",  label = "1:1 · Square" },
  { value = "3:4",  label = "3:4 · Portrait" },
  { value = "9:16", label = "9:16 · Portrait · Vertical" },
  { value = "21:9", label = "21:9 · Ultrawide" },
  { value = "9:21", label = "9:21 · Tall Vertical" },
]
note = "Ignored when an image is used"

[params.duration]
label = "Duration"
type = "integer"
default = 5
min = 4
max = 12
note = "Video duration in seconds (4-12)"

[params.fps]
label = "FPS"
type = "select"
default = "24"
options = [
  { value = "24", label = "24 FPS · Fixed" },
]
hidden = true

[params.camera_fixed]
label = "Fixed Camera"
type = "boolean"
default = false
hidden = true

[params.seed]
label = "Random Seed"
type = "integer"
default = -1
min = -1
max = 2147483647
optional = true
hidden = true
