id = "grok-imagine-video"
label = "Grok Imagine Video"
category = "VID"
platform = "replicate"
endpoint = "xai/grok-imagine-video"
description = "xAI's Grok Imagine Video: generates videos from text, images, or edits existing videos. Supports 1-15 second durations, text-to-video and image-to-video. Video editing mode for transforming existing footage."

[pricing]
cost_per_second = 0.10
currency = "USD"

[general]
image_url_param = "image"
duration_type = "seconds"
duration_param_name = "duration"
slots = ["video"]

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "auto"
optional = true
options = [
  { value = "auto", label = "Auto · Default" },
  { value = "16:9", label = "16:9 · Landscape" },
  { value = "4:3",  label = "4:3 · Classic" },
  { value = "1:1",  label = "1:1 · Square" },
  { value = "9:16", label = "9:16 · Portrait · Vertical" },
  { value = "3:4",  label = "3:4 · Portrait" },
  { value = "3:2",  label = "3:2 · Landscape" },
  { value = "2:3",  label = "2:3 · Portrait" },
]
note = "For text-to-video defaults to 16:9. For image-to-video defaults to input image's native ratio. Ignored when editing a video."

[params.duration]
label = "Duration"
type = "integer"
default = 5
min = 1
max = 15
note = "Seconds (1-15). Ignored when editing a video"

[params.resolution]
label = "Resolution"
type = "select"
default = "720p"
optional = true
options = [
  { value = "480p",  label = "480p" },
  { value = "720p",  label = "720p · Standard" },
]
note = "Ignored when editing a video"
