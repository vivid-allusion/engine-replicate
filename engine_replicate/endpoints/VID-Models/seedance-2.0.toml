id = "seedance-2.0"
label = "Seedance 2.0"
category = "VID"
platform = "replicate"
endpoint = "bytedance/seedance-2.0"
description = "ByteDance's Seedance 2.0: multimodal video generation with native audio, reference images/videos/audios for character consistency and style guidance. Intelligent duration control (set to -1 for auto). Supports up to 9 reference images, 3 videos, and 3 audio files."

[pricing]
cost_per_second = 0.20
currency = "USD"

[general]
image_url_param = "image"
duration_type = "seconds"
duration_param_name = "duration"
slots = ["reference_images", "reference_videos", "reference_audios", "last_frame_image"]

[params.resolution]
label = "Resolution"
type = "select"
default = "720p"
options = [
  { value = "480p",  label = "480p · Lower cost" },
  { value = "720p",  label = "720p · Standard" },
  { value = "1080p", label = "1080p · Full HD" },
  { value = "4k",    label = "4K · Ultra HD" },
]

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "16:9"
optional = true
options = [
  { value = "16:9",     label = "16:9 · Landscape" },
  { value = "4:3",      label = "4:3 · Classic" },
  { value = "1:1",      label = "1:1 · Square" },
  { value = "3:4",      label = "3:4 · Portrait" },
  { value = "9:16",     label = "9:16 · Portrait · Vertical" },
  { value = "21:9",     label = "21:9 · Ultrawide" },
  { value = "9:21",     label = "9:21 · Tall Vertical" },
  { value = "adaptive", label = "Adaptive · Model chooses" },
]

[params.duration]
label = "Duration"
type = "integer"
default = 5
min = -1
max = 15
note = "Seconds. Set to -1 for intelligent duration (model picks)"

[params.generate_audio]
label = "Generate Native Audio"
type = "boolean"
default = true
description = "Generate synchronized audio including dialogue (use quotes in prompt), sound effects, and background music"

[params.seed]
label = "Random Seed"
type = "integer"
default = -1
min = -1
max = 2147483647
optional = true
hidden = true
