id = "kling-v2.6"
label = "Kling 2.6"
category = "VID"
platform = "replicate"
endpoint = "kwaivgi/kling-v2.6"
description = "Kling 2.6: top-tier image-to-video with cinematic visuals, fluid motion, and native audio generation. Generates synchronized speech, ambient effects, and soundscapes in a single pass. Supports lip-synced dialogue."

[pricing]
cost_per_second = 0.175
currency = "USD"

[general]
image_url_param = "start_image"
duration_type = "seconds"
duration_param_name = "duration"
slots = ["end_image"]

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "16:9"
optional = true
options = [
  { value = "16:9", label = "16:9 · Landscape" },
  { value = "9:16", label = "9:16 · Portrait · Vertical" },
  { value = "1:1",  label = "1:1 · Square" },
]
note = "Ignored when start_image is provided"

[params.duration]
label = "Duration"
type = "select"
default = "5"
options = [
  { value = "5",  label = "5s · Short" },
  { value = "10", label = "10s · Long" },
]

[params.generate_audio]
label = "Generate Native Audio"
type = "boolean"
default = true
description = "Generate synchronized audio including dialogue (use quotes in prompt), ambient effects, and soundscapes"

[params.negative_prompt]
label = "Negative Prompt"
type = "text"
optional = true
default = ""
