id = "nano-banana-pro"
label = "Nano Banana Pro"
category = "IMG"
platform = "replicate"
endpoint = "google/nano-banana-pro"
description = "Google's premium image generation model with higher quality output, better instruction following, and more aspect ratio options. Higher cost per image than Nano Banana 2."

[pricing]
base_cost = 0.14
currency = "USD"

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "16:9"
optional = true
options = [
  { value = "1:1",   label = "1:1 · Square" },
  { value = "2:3",   label = "2:3 · Portrait" },
  { value = "3:2",   label = "3:2 · Landscape" },
  { value = "3:4",   label = "3:4 · Portrait" },
  { value = "4:3",   label = "4:3 · Classic" },
  { value = "4:5",   label = "4:5 · Portrait" },
  { value = "5:4",   label = "5:4 · Landscape" },
  { value = "9:16",  label = "9:16 · Vertical" },
  { value = "16:9",  label = "16:9 · Landscape · Standard" },
  { value = "21:9",  label = "21:9 · Ultrawide · Cinematic" },
  { value = "match_input_image", label = "Match Input Image" },
]

[params.resolution]
label = "Resolution"
type = "select"
default = "2K"
optional = true
options = [
  { value = "1K", label = "1K (1024px short side)" },
  { value = "2K", label = "2K (2048px short side)" },
  { value = "4K", label = "4K (4096px short side)" },
]
note = "Higher resolutions take longer to generate"

[params.output_format]
label = "Output Format"
type = "select"
default = "png"
options = [
  { value = "png",  label = "PNG" },
  { value = "jpg",  label = "JPEG" },
]

[params.safety_filter_level]
label = "Safety Filter"
type = "select"
default = "block_only_high"
options = [
  { value = "block_low_and_above",   label = "Block Low+" },
  { value = "block_medium_and_above", label = "Block Medium+" },
  { value = "block_only_high",       label = "Block Only High" },
]

[params.allow_fallback_model]
label = "Allow Fallback Model"
type = "boolean"
default = false
hidden = true
description = "Allow Google's API to fall back to a different model version when capacity is limited"
