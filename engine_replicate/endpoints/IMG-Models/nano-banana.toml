id = "nano-banana"
label = "Nano Banana"
category = "IMG"
platform = "replicate"
endpoint = "google/nano-banana"
description = "Google's original Nano Banana image model. Still available but consider upgrading to Nano Banana 2 for better quality and more features."

[pricing]
base_cost = 0.039
currency = "USD"
note = "Superseded by Nano Banana 2. Pricing varies by aspect ratio."

[general]
image_url_param = "image_input"

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "match_input_image"
optional = true
options = [
  { value = "1:1",   label = "1:1 · Square" },
  { value = "2:3",   label = "2:3 · Portrait" },
  { value = "3:2",   label = "3:2 · Landscape" },
  { value = "3:4",   label = "3:4 · Portrait" },
  { value = "4:3",   label = "4:3 · Classic" },
  { value = "4:5",   label = "4:5 · Portrait" },
  { value = "5:4",   label = "5:4 · Landscape" },
  { value = "9:16",  label = "9:16 · Portrait · Vertical" },
  { value = "16:9",  label = "16:9 · Landscape · Standard" },
  { value = "21:9",  label = "21:9 · Ultrawide · Cinematic" },
  { value = "match_input_image", label = "Match Input Image" },
]

[params.output_format]
label = "Output Format"
type = "select"
default = "jpg"
options = [
  { value = "png", label = "PNG" },
  { value = "jpg", label = "JPEG" },
]
