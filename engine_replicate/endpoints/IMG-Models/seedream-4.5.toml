id = "seedream-4.5"
label = "Seedream 4.5"
category = "IMG"
platform = "replicate"
endpoint = "bytedance/seedream-4.5"
description = "ByteDance's upgraded image model with stronger spatial understanding and world knowledge. Supports cinematic aesthetics, multi-reference generation (up to 14 images), and custom resolutions (2K/4K). 1K resolution not supported."

[pricing]
base_cost = 0.05
currency = "USD"

[params.size]
label = "Resolution"
type = "select"
default = "2K"
options = [
  { value = "2K",    label = "2K (2048px) · Standard" },
  { value = "4K",    label = "4K (4096px) · High Quality" },
  { value = "custom", label = "Custom · Set width/height manually" },
]
note = "1K resolution is not supported in Seedream 4.5"

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "16:9"
optional = true
options = [
  { value = "1:1",   label = "1:1 · Square" },
  { value = "3:4",   label = "3:4 · Portrait" },
  { value = "4:3",   label = "4:3 · Classic" },
  { value = "9:16",  label = "9:16 · Vertical" },
  { value = "16:9",  label = "16:9 · Landscape · Standard" },
  { value = "21:9",  label = "21:9 · Ultrawide · Cinematic" },
  { value = "match_input_image", label = "Match Input Image" },
]
note = "Only used when size is not 'custom'"

[params.width]
label = "Custom Width (px)"
type = "integer"
default = 2048
min = 1024
max = 4096
optional = true
hidden = true
description = "Only used when size='custom'"

[params.height]
label = "Custom Height (px)"
type = "integer"
default = 2048
min = 1024
max = 4096
optional = true
hidden = true
description = "Only used when size='custom'"

[params.max_images]
label = "Max Images per run"
type = "integer"
default = 1
min = 1
max = 15
optional = true
description = "Only used when sequential_image_generation='auto'"

[params.sequential_image_generation]
label = "Sequential Generation"
type = "select"
default = "disabled"
options = [
  { value = "disabled", label = "Disabled · Single image" },
  { value = "auto",     label = "Auto · Model decides group generation" },
]

[params.disable_safety_checker]
label = "Disable Safety Checker"
type = "boolean"
default = false
hidden = true
description = "When enabled, input moderation is relaxed to only block illegal content (CSAM). Use responsibly."
