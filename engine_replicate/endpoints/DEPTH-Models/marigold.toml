platform = "replicate"
endpoint = "adirik/marigold:1a363593bc4882684fc58042d19db5e13a810e44e02f8d4c32afd1eb30464818"
description = "Marigold: picture to depth map."

[general]
image_url_param = "image"

[params.seed]
label = "Seed"
type = "integer"
