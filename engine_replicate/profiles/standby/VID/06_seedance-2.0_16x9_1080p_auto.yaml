# Seedance 2.0 — 16:9 · 1080p · Auto duration
platform: replicate
endpoint: bytedance/seedance-2.0
media_type: video
image_url_param: image
duration_type: seconds
duration_param_name: duration
slots: ["reference_images", "reference_videos", "reference_audios"]
parameters:
  resolution: "1080p"
  aspect_ratio: "16:9"
  duration: "-1"
  generate_audio: true
  # Advanced parameters (uncomment to use)
  #seed: -1
pricing:
  cost_per_second: 0.20
  currency: USD

# Prompt modifications (uncomment to use)
#prompt_prefix: ''
#prompt_suffix: ''
