# P-Video — 16:9 · 720p · 5s · 24 FPS
platform: replicate
endpoint: prunaai/p-video
media_type: video
image_url_param: image
duration_type: seconds
duration_param_name: duration
slots: ["audio", "last_frame_image"]
parameters:
  aspect_ratio: "16:9"
  duration: 5
  resolution: "720p"
  fps: "24"
  draft: false
  prompt_upsampling: true
  save_audio: true
  disable_safety_filter: true
  # Advanced parameters (uncomment to use)
  #no_op: false
  #seed: -1
pricing:
  cost_per_second: 0.02
  currency: USD

# Prompt modifications (uncomment to use)
#prompt_prefix: ''
#prompt_suffix: ''
