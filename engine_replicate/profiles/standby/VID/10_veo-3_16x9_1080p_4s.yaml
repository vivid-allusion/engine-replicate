# Veo 3 — 16:9 · 1080p · 4s
platform: replicate
endpoint: google/veo-3
media_type: video
image_url_param: image
duration_type: seconds
duration_param_name: duration
parameters:
  aspect_ratio: "16:9"
  duration: "4"
  resolution: "1080p"
  generate_audio: true
  # Advanced parameters (uncomment to use)
  #negative_prompt: ""
  #seed: -1
pricing:
  cost_per_second: 0.50
  currency: USD

# Prompt modifications (uncomment to use)
#prompt_prefix: ''
#prompt_suffix: ''
