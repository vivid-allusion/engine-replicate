# Kling Video 3.0 — Pro · 16:9 · 5s
platform: replicate
endpoint: kwaivgi/kling-v3-video
media_type: video
image_url_param: start_image
duration_type: seconds
duration_param_name: duration
slots: ["end_image"]
parameters:
  mode: "pro"
  aspect_ratio: "16:9"
  duration: 5
  generate_audio: false
  # Advanced parameters (uncomment to use)
  #multi_prompt: ""
  #negative_prompt: ""
pricing:
  cost_per_second: 0.35
  currency: USD

# Prompt modifications (uncomment to use)
#prompt_prefix: ''
#prompt_suffix: ''
