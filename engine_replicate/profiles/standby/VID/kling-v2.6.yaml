# Kling 2.6
platform: replicate
endpoint: kwaivgi/kling-v2.6
media_type: video
image_url_param: start_image
duration_type: seconds
duration_param_name: duration
slots: ["end_image"]
parameters:
  aspect_ratio: "16:9"
  duration: "5"
  generate_audio: true
  # Advanced parameters (uncomment to use)
  #negative_prompt: ""
pricing:
  cost_per_second: 0.175
  currency: USD

# Prompt modifications (uncomment to use)
#prompt_prefix: ''
#prompt_suffix: ''
