[project]
name = "engine-replicate"
version = "0.1.0"
description = "Engine wrapper for the Replicate API. Uniform interface that studiolot Vehicles call instead of importing the Replicate SDK directly."
requires-python = ">=3.10"
dependencies = [
    "replicate>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools]
packages = ["engine_replicate"]

[tool.setuptools.package-data]
engine_replicate = ["endpoints/**/*.toml", "endpoints/**/*.gitkeep", "profiles/standby/**/*.yaml"]
